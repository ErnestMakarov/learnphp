services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: learnphp
      MARIADB_USER: learnphp
      MARIADB_PASSWORD: local-coursework
      MARIADB_ROOT_PASSWORD: local-root-only
    ports:
      - "127.0.0.1:33061:3306"
    volumes:
      - learnphp_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  learnphp_db:
